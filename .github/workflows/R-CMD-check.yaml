name: R-CMD-check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      # igraph 1.0.1 is bundled in src/igraph and compiled from those sources,
      # so no external igraph, pkg-config or MSYS2/UCRT64 igraph package is set
      # up here. No IGRAPH_* environment variable is needed.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2, any::devtools
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      - if: runner.os == 'Linux'
        name: Native memory checks
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y valgrind

          # Which igraph translation units get compiled is decided in exactly one
          # place: src/Makevars.igraph. Asking make for the archive target reuses
          # that object list instead of re-globbing the source tree, so this job
          # compiles the same 189 units as the package and not the full set of
          # 700. R's Makeconf supplies CC, CXX, AR and the compiler flags, so the
          # C translation units go through the same rules as a real install and
          # any future C++ unit would be handled too. The compiler runs with R's
          # normal warning flags; no -w is used, so warnings stay visible.
          R_HOME="$(R RHOME)"
          ( cd src && make -f "${R_HOME}/etc/Makeconf" -f Makevars igraph/libigraph.a )

          LIB="$(find src -name 'libigraph.a' -print -quit)"
          test -n "${LIB}"

          # The archive must contain exactly the objects the manifest names --
          # no more (that would mean the whole source tree is being compiled) and
          # no fewer (that would mean the list is out of date).
          EXPECTED="$(grep -oE 'igraph/obj/[A-Za-z0-9_./-]+\.o' src/Makevars.igraph | sort -u | wc -l)"
          NOBJ="$(ar t "${LIB}" | wc -l)"
          echo "manifest objects: ${EXPECTED}; archive members: ${NOBJ}"
          test "${NOBJ}" -eq "${EXPECTED}"

          # Link the native harnesses against that archive and run them under
          # valgrind. Both harnesses only use igraph entry points that the
          # package itself compiles, so a link failure here also means the
          # manifest lost something the package needs.
          cc -g -Isrc -Isrc/igraph/include tools/native-smoke.c src/decom_h.c "${LIB}" -lm -o /tmp/gatoms-native
          valgrind --leak-check=full --errors-for-leak-kinds=definite --error-exitcode=1 /tmp/gatoms-native

          cc -g -Isrc -Isrc/igraph/include tools/native-faults.c src/decom_h.c "${LIB}" -Wl,--wrap=malloc -Wl,--wrap=free -o /tmp/gatoms-faults
          /tmp/gatoms-faults
