name: R-CMD-check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      # igraph 1.0.1 is bundled in src/igraph and compiled from those sources,
      # so no external igraph, pkg-config or MSYS2/UCRT64 igraph package is set
      # up here. No IGRAPH_* environment variable is needed.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2, any::devtools
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      - if: runner.os == 'Linux'
        name: Native memory checks
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y valgrind

          # Which igraph translation units get compiled is decided in exactly one
          # place: src/Makevars.igraph. Reusing it means this job compiles the
          # same 189 units as the package instead of re-globbing the whole source
          # tree.
          #
          # The build is driven by R CMD SHLIB rather than by calling make on
          # etc/Makeconf directly. R's Makeconf is not standalone: it includes
          # $(R_SHARE_DIR)/make/vars.mk, and R_SHARE_DIR (together with the other
          # R_* build paths) is exported by the R CMD front end, not written into
          # Makeconf. Invoking make by hand therefore fails at that include with
          #     Makeconf:10: /make/vars.mk: No such file or directory
          # as soon as R_SHARE_DIR is empty. R CMD SHLIB initialises all of that
          # itself. It builds $(SHLIB), and src/Makevars registers the archive as
          # a prerequisite of $(SHLIB), so the same 189 objects are compiled and
          # src/igraph/libigraph.a (under src/igraph/<R_ARCH>/) is left behind.
          ( cd src && R CMD SHLIB -o gatoms-ci.so )

          LIB="$(find src -name 'libigraph.a' -print -quit)"
          test -n "${LIB}"

          # The archive must contain exactly the objects the manifest names --
          # no more (that would mean the source tree is being compiled wholesale)
          # and no fewer (that would mean the list is out of date).
          EXPECTED="$(grep -oE 'igraph/obj/[A-Za-z0-9_./-]+\.o' src/Makevars.igraph | sort -u | wc -l)"
          NOBJ="$(ar t "${LIB}" | wc -l)"
          echo "manifest objects: ${EXPECTED}; archive members: ${NOBJ} (${LIB})"
          test "${NOBJ}" -eq "${EXPECTED}"

          # Link the native harnesses against that archive and run them under
          # valgrind. Both harnesses only use igraph entry points that the package
          # itself compiles, so a link failure here also means the manifest lost
          # something the package needs. No -w / -Wno-*: warnings stay visible and
          # the job has already been told to fail on any command that exits
          # non-zero.
          cc -g -Isrc -Isrc/igraph/include tools/native-smoke.c src/decom_h.c "${LIB}" -lm -o /tmp/gatoms-native
          valgrind --leak-check=full --errors-for-leak-kinds=definite --error-exitcode=1 /tmp/gatoms-native

          cc -g -Isrc -Isrc/igraph/include tools/native-faults.c src/decom_h.c "${LIB}" -Wl,--wrap=malloc -Wl,--wrap=free -o /tmp/gatoms-faults
          /tmp/gatoms-faults
